<!DOCTYPE html>
<html>
<head>
  <title>Infinite Scrolling Marquee</title>
  <style>
    .marquee {
      width: 100%;
      height: 200px;
      overflow: hidden;
      position: relative;
      background-color: black;
    }

    .marquee img {
      height: 200px;
      display: inline-block;
      margin: 0;
      padding: 0;
    }

    .marquee-content {
      display: flex;
      will-change: transform;
    }
  </style>
</head>
<body>
  <div class="marquee">
    <div class="marquee-content">
      <img src="/frontend/images/logos/samples/adventure_exploration_nature.png" alt="Logo 1" class="logo-image">
      <img src="/frontend/images/logos/samples/child_running.png" alt="Logo 2" class="logo-image">
      <img src="/frontend/images/logos/samples/city_countryside_forest.png" alt="Logo 3" class="logo-image">
      <img src="/frontend/images/logos/samples/fishing_exploring_camping.png" alt="Logo 4" class="logo-image">
      <img src="/frontend/images/logos/samples/hiking_ice_gazing.png" alt="Logo 5" class="logo-image">
      <img src="/frontend/images/logos/samples/ice_cream_truck.png" alt="Logo 6" class="logo-image">
      <img src="/frontend/images/logos/samples/ice_skating.png" alt="Logo 7" class="logo-image">
      <img src="/frontend/images/logos/samples/mountain_climbing.png" alt="Logo 8" class="logo-image">
      <img src="/frontend/images/logos/samples/shiny_pear.png" alt="Logo 9" class="logo-image">
      <img src="/frontend/images/logos/samples/sunset_skating_deep.png" alt="Logo 10" class="logo-image">
      <img src="/frontend/images/logos/samples/sunshine_cooling_harvest.png" alt="Logo 11" class="logo-image">
      <img src="/frontend/images/logos/samples/adventure_exploration_nature.png" alt="Logo 1" class="logo-image">
      <img src="/frontend/images/logos/samples/child_running.png" alt="Logo 2" class="logo-image">
      <img src="/frontend/images/logos/samples/city_countryside_forest.png" alt="Logo 3" class="logo-image">
      <img src="/frontend/images/logos/samples/fishing_exploring_camping.png" alt="Logo 4" class="logo-image">
      <img src="/frontend/images/logos/samples/hiking_ice_gazing.png" alt="Logo 5" class="logo-image">
      <img src="/frontend/images/logos/samples/ice_cream_truck.png" alt="Logo 6" class="logo-image">
      <img src="/frontend/images/logos/samples/ice_skating.png" alt="Logo 7" class="logo-image">
      <img src="/frontend/images/logos/samples/mountain_climbing.png" alt="Logo 8" class="logo-image">
      <img src="/frontend/images/logos/samples/shiny_pear.png" alt="Logo 9" class="logo-image">
      <img src="/frontend/images/logos/samples/sunset_skating_deep.png" alt="Logo 10" class="logo-image">
      <img src="/frontend/images/logos/samples/sunshine_cooling_harvest.png" alt="Logo 11" class="logo-image">
    </div>
  </div>

  <script>
    const marqueeContent = document.querySelector('.marquee-content');
    const marqueeContainer = document.querySelector('.marquee');

    let isAnimating = true;
    let currentPosition = 0;

    function animateMarquee() {
      if (!isAnimating) return;

      currentPosition -= 1;
      marqueeContent.style.transform = `translateX(${currentPosition}px)`;

      const containerWidth = marqueeContainer.offsetWidth;
      const contentWidth = marqueeContent.offsetWidth;

      if (Math.abs(currentPosition) >= contentWidth - containerWidth) {
        currentPosition = 0;
      }

      requestAnimationFrame(animateMarquee);
    }

    animateMarquee();
  </script>
</body>
</html>
